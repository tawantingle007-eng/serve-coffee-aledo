<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R; uniform float ph; uniform float frame;
const float P = 4.0; // z period for loop
float h(vec3 q){ q = vec3(q.x, q.y, mod(q.z, P)); return fract(sin(dot(q, vec3(127.1,311.7,74.7)))*43758.5453); }
vec3 g(vec3 q){ float a=h(q)*6.2831853, b=h(q+17.0)*2.0-1.0; float s=sqrt(1.0-b*b); return vec3(s*cos(a), s*sin(a), b); }
float gn(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*f*(f*(f*6.0-15.0)+10.0);
 float n000=dot(g(i),f), n100=dot(g(i+vec3(1,0,0)),f-vec3(1,0,0)), n010=dot(g(i+vec3(0,1,0)),f-vec3(0,1,0)), n110=dot(g(i+vec3(1,1,0)),f-vec3(1,1,0));
 float n001=dot(g(i+vec3(0,0,1)),f-vec3(0,0,1)), n101=dot(g(i+vec3(1,0,1)),f-vec3(1,0,1)), n011=dot(g(i+vec3(0,1,1)),f-vec3(0,1,1)), n111=dot(g(i+vec3(1,1,1)),f-vec3(1,1,1));
 return mix(mix(mix(n000,n100,u.x),mix(n010,n110,u.x),u.y),mix(mix(n001,n101,u.x),mix(n011,n111,u.x),u.y),u.z); }
float fbm(vec2 p, float z){ float a=0.5, s=0.0; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int k=0;k<5;k++){ s+=a*gn(vec3(p, z)); p=m*p; a*=0.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
void main(){
 vec2 uv = gl_FragCoord.xy / R; vec2 p = (gl_FragCoord.xy - 0.5*R) / R.y;
 float z = ph * P; // loops exactly
 vec2 cc = vec2(0.42, 0.02); vec2 q = p - cc; float r = length(q);
 // light dir top-left
 vec2 L = normalize(vec2(-0.6, 0.8));
 // ---- wood table
 vec2 wp = rot(0.18) * p; float grain = fbm(vec2(wp.x*0.7, wp.y*7.0), 0.0);
 float fine = sin(wp.y*260.0 + grain*30.0 + 4.0*gn(vec3(wp*vec2(2.0,40.0),0.5)))*0.5+0.5;
 float rings = sin(wp.y*38.0 + grain*14.0)*0.5+0.5;
 vec3 wood = mix(vec3(0.42,0.26,0.13), vec3(0.74,0.53,0.31), 0.45*rings + 0.4*(grain*0.9+0.5) + 0.15*fine);
 wood *= 0.9 + 0.1*sin(wp.x*3.0);
 // plank seams
 float seam = smoothstep(0.004, 0.0, abs(fract(wp.y*2.1)-0.5)-0.496); wood *= 1.0 - 0.45*seam;
 // window light falloff + soft shadow of cup
 float light = 0.55 + 0.55*smoothstep(1.3, -0.4, dot(p, vec2(0.7,-0.5)) );
 // leaf-dapple shadows drifting (loop)
 float dap = smoothstep(0.05, 0.35, fbm(p*2.2 + vec2(0.0, 0.0), z*0.25 + 1.0)*0.9+0.25);
 light *= 0.72 + 0.28*dap;
 vec2 sq = q - (-L)*0.07; float sh = smoothstep(0.50, 0.30, length(sq*vec2(1.0,1.05)));
 vec3 col = wood * light * (1.0 - 0.55*sh);
 // ---- saucer
 float sr = 0.43; float saucer = smoothstep(sr+0.003, sr-0.003, r);
 float sn = dot(normalize(q+1e-5), L);
 vec3 cream = vec3(0.93,0.89,0.82);
 float rim = smoothstep(sr-0.06, sr, r);
 vec3 sc = cream * (0.78 + 0.22*sn*rim + 0.12*(1.0-r/sr)) ;
 float cupSh = smoothstep(0.36, 0.27, length(q - (-L)*0.035));
 sc *= 1.0 - 0.35*cupSh;
 col = mix(col, sc * light, saucer);
 // ---- cup wall (slate teal glaze, seen from top as ring)
 float cr = 0.30, ci = 0.262;
 vec3 glaze = vec3(0.17,0.29,0.31);
 // handle (capsule attached to cup wall)
 vec2 hd = normalize(vec2(1.0,-0.32)); vec2 ha = hd*0.27, hb = hd*0.40;
 vec2 pa = q-ha, ba = hb-ha; float hh = clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); float hdist = length(pa-ba*hh);
 float handle = smoothstep(0.036, 0.032, hdist);
 vec2 hn = (pa-ba*hh)/max(hdist,1e-4);
 vec3 hc = glaze*(0.7+0.45*dot(hn,L)) + vec3(0.9,0.85,0.75)*pow(max(0.0,dot(hn,L)),12.0)*0.5;
 float hsh = smoothstep(0.05,0.02,length((q-(-L)*0.03)-ha-ba*clamp(dot((q-(-L)*0.03)-ha,ba)/dot(ba,ba),0.0,1.0)));
 col *= 1.0 - 0.3*hsh*(1.0-handle);
 col = mix(col, hc*light, handle);
 float cup = smoothstep(cr+0.003, cr-0.003, r);
 float lip = smoothstep(ci, ci+0.01, r) * smoothstep(cr, cr-0.01, r);
 float spec = pow(max(0.0, sn), 8.0);
 vec3 cupc = glaze * (0.75 + 0.35*sn) + vec3(0.9,0.85,0.75)*spec*0.6*lip;
 // inner rim lighter edge (glazed lip)
 cupc = mix(cupc, vec3(0.86,0.83,0.77)*(0.85+0.2*sn), smoothstep(0.012,0.0,abs(r-ci-0.006)));
 col = mix(col, cupc*light, cup);
 // ---- coffee surface
 float inside = smoothstep(ci, ci-0.003, r);
 vec2 s = q / ci; float sr2 = length(s);
 float tw = 2.6*exp(-2.2*sr2) + 0.25*sin(6.2831853*ph);   // vortex twist, gently breathing
 vec2 w = rot(tw) * s;
 vec2 o1 = vec2(fbm(w*1.8, z), fbm(w*1.8 + 5.2, z));
 vec2 o2 = vec2(fbm(w*1.6 + 2.0*o1 + vec2(1.7,9.2), z + 1.0), fbm(w*1.6 + 2.0*o1 + vec2(8.3,2.8), z + 2.0));
 float m = fbm(w*1.3 + 2.4*o2, z + 3.0);
 // heart-ish latte art blob: rosetta core from milk
 float milk = smoothstep(-0.02, 0.30, m + 0.26 - 0.6*sr2*sr2);
 float crema = smoothstep(-0.25, 0.35, m);
 vec3 esp = vec3(0.17,0.09,0.05); vec3 crm = vec3(0.55,0.33,0.17); vec3 mlk = vec3(0.93,0.87,0.77);
 vec3 cof = mix(esp, crm, crema*0.85);
 cof = mix(cof, crm*1.25, smoothstep(0.75, 1.0, sr2)*0.6); // crema ring at edge
 float mr = fbm(w*1.3 + 2.4*o2 + vec2(0.01,0.012), z + 3.0) - m; // foam relief
 cof = mix(cof, mlk*(0.93 + 6.0*mr), milk);
 // micro-foam texture
 cof *= 0.96 + 0.06*gn(vec3(s*90.0, z*2.0));
 // surface lighting: meniscus darkening + window reflection
 float men = smoothstep(0.86, 1.0, sr2); cof *= 1.0 - 0.35*men;
 vec2 rq = s - vec2(-0.38, 0.42); float refl = smoothstep(0.32, 0.0, length(rq*vec2(1.0,1.6)));
 cof += vec3(1.0,0.96,0.88)*refl*0.10*(0.7+0.3*fbm(s*3.0, z));
 col = mix(col, cof*(0.92+0.15*light), inside);
 // ---- steam wisps (above everything), drift up, loop via z
 vec2 sp = p - cc; sp.y -= 0.05;
 float rise = ph*1.0; // one full z period = loop
 float st = fbm(vec2(sp.x*2.2, sp.y*1.4 - 0.0) + vec2(0.0, 0.0), z*1.0 + 6.0);
 float st2 = fbm(vec2(sp.x*3.5 + st*1.5, sp.y*2.0), z*2.0 + 9.0);
 float steam = smoothstep(0.05, 0.45, st2 + 0.15) * exp(-pow(sp.x*2.6,2.0)) * smoothstep(-0.25, 0.25, sp.y) * smoothstep(0.75, 0.2, sp.y);
 col = mix(col, vec3(0.97,0.95,0.92), steam*0.38);
 // ---- grade: warm highlights, teal shadows, vignette, grain
 float lum = dot(col, vec3(0.299,0.587,0.114));
 col = mix(col, col*vec3(0.92,1.0,1.02), smoothstep(0.4, 0.0, lum)*0.5);
 col = pow(col, vec3(0.95));
 float vig = smoothstep(1.25, 0.25, length((uv-0.5)*vec2(1.6,1.0)));
 col *= 0.55 + 0.45*vig;
 float n = fract(sin(dot(gl_FragCoord.xy + frame*7.13, vec2(12.9898,78.233)))*43758.5453);
 col += (n-0.5)*0.025;
 gl_FragColor = vec4(clamp(col,0.0,1.0),1.0);
}
</script>
<script>
const c=document.getElementById('c'); const gl=c.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'R'),uP=gl.getUniformLocation(pr,'ph'),uF=gl.getUniformLocation(pr,'frame');
window.N = +(new URLSearchParams(location.search).get('n')||360);
window.renderFrame=(i)=>{gl.viewport(0,0,c.width,c.height);gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uP,(i%N)/N);gl.uniform1f(uF,i);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();return c.toDataURL('image/png');};
window.ready=true;
</script></body></html>
